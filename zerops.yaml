zerops:
  - setup: app
    build:
      base: nodejs@20
      buildCommands:
        - npm ci
        - npm run build
      deployFiles:
        - .next
        - public
        - package.json
        - node_modules
      cache:
        - node_modules
        - .next/cache
    run:
      base: nodejs@20
      ports:
        - port: 3000
          httpSupport: true
      start: npm run start
