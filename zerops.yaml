zerops:
  - setup: app
    build:
      base: nodejs@20
      buildCommands:
        - rm -rf .next
        - npm install
        - npm run build
      deployFiles:
        - .next
        - public
        - package.json
        - node_modules
        - next.config.mjs
      cache:
        - node_modules
    run:
      base: nodejs@20
      ports:
        - port: 3000
          httpSupport: true
      start: npm run start
